name: DIVISAShopper
options:
  bundleIdPrefix: com.divisashopper
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.divisashopper.shopper
    INFOPLIST_FILE: DIVISAShopper/Info.plist
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.0.0
  MetaWearables:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  DIVISAShopper:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - README.md
          - ARCHITECTURE.md
          - PackageDependencies.md
          - Info.plist.fragment.xml
          - project.yml
          - DIVISAShopper/Info.plist
    info:
      path: DIVISAShopper/Info.plist
      properties:
        CFBundleDisplayName: DIVISA SHOPPER
        MWDAT:
          AppLinkURLScheme: "divisa-shopper://"
          MetaAppID: "0"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.divisashopper.shopper
            CFBundleURLSchemes:
              - divisa-shopper
        LSApplicationQueriesSchemes:
          - fb-viewapp
        UIBackgroundModes:
          - processing
          - bluetooth-central
          - bluetooth-peripheral
          - external-accessory
        UISupportedExternalAccessoryProtocols:
          - com.meta.ar.wearable
        NSBonjourServices:
          - _bonjour._tcp
        UILaunchScreen: {}
        NSCameraUsageDescription: DIVISA SHOPPER usa la cámara del iPhone como respaldo durante la compra asistida.
        NSMicrophoneUsageDescription: DIVISA SHOPPER usa el micrófono para conversar con el cliente.
        NSBluetoothAlwaysUsageDescription: DIVISA SHOPPER usa Bluetooth para conectarse a las Ray-Ban Meta.
        NSLocalNetworkUsageDescription: DIVISA SHOPPER usa la red local para comunicarse con dispositivos compatibles.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    dependencies:
      - package: LiveKit
        product: LiveKit
      - package: MetaWearables
        product: MWDATCore
      - package: MetaWearables
        product: MWDATCamera
